[package]
name          = "neutrino-light-client"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
authors       = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
publish       = { workspace = true }

[features]
default = ["std"]
std = ["neutrino-consensus-types/std", "neutrino-primitives/std", "neutrino-prover-checkpoint/std", "borsh/std"]

[dependencies]
borsh = { workspace = true }
neutrino-consensus-types = { workspace = true }
neutrino-primitives = { workspace = true }
neutrino-prover-checkpoint = { workspace = true, default-features = false }

[lints]
workspace = true
