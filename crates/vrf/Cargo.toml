[package]
name          = "neutrino-vrf"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
authors       = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
publish       = { workspace = true }

# Portable message, eligibility and seed logic is available without std.
# Native BLS signing/verification is provided by the std feature.

[features]
default = ["std"]
std = ["dep:neutrino-crypto"]

[dependencies]
neutrino-primitives = { workspace = true }
neutrino-crypto     = { workspace = true, optional = true }
sha2                = { workspace = true }

[dev-dependencies]
# Tests use rand_chacha (rand_core 0.6 compatible) so they can feed
# `neutrino-crypto::SecretKey::generate`, plus rand 0.10 stays out of
# the VRF test path.
rand_chacha         = { workspace = true }
rand_core           = { workspace = true }

[lints]
workspace = true
